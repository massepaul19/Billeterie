# --- Règles métier (valeurs à valider en équipe, voir docs/REGLES_GESTION.md) ---
billetterie.reservation.duree-blocage-minutes=5
billetterie.reservation.max-en-attente-par-telephone=3
# Le taux de commission n'est plus ici : table parametre, cle commission_taux
billetterie.annulation.delai-limite-heures=2
billetterie.annulation.retenue-pourcentage=5

# --- Fichiers (logos, photos) : API v0.2 ---
billetterie.fichiers.dossier=./uploads
billetterie.public-url=http://localhost:${server.port}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
