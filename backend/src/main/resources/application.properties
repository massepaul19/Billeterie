spring.application.name=billetterie
server.port=6012

# --- SQLite : un seul fichier portable. WAL + attente en cas de verrou + clés étrangères actives ---
spring.datasource.url=jdbc:sqlite:./data/billetterie.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=true&date_class=TEXT
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Le schéma est géré par nous (database/schema.sql), pas par Hibernate
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:seed.sql

# Fuseau horaire du Cameroun
spring.jackson.time-zone=Africa/Douala
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Douala

